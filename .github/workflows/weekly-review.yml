# Sunday: plain-English review of the week -> REPORT.md + a GitHub issue.
name: weekly-review
on:
  schedule:
    - cron: "33 16 * * 0"
  workflow_dispatch:
permissions: { contents: write, issues: write }
jobs:
  review:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'claude_code,gemini,github_models' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TRAFFIC_MODE: organic
      DRY_RUN: ${{ vars.DRY_RUN || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e . "psycopg[binary]" && npm i -g @anthropic-ai/claude-code
      - run: python -m pod.batch review
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.create({...context.repo,
              title: "Weekly review " + new Date().toISOString().slice(0,10),
              labels: ["review"], body: fs.readFileSync('REPORT.md','utf8')});
